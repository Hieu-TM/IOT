<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Aqua Scope</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: #F5F6F2; color: #20231F; }
    .login-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .login-panel { width: min(100%, 430px); background: #FFFFFF; border: 1px solid #DBDDD5; border-radius: 12px; box-shadow: 0 18px 45px rgba(24,26,22,.10); overflow: hidden; }
    .login-brand { display: flex; gap: 14px; padding: 24px 24px 18px; border-bottom: 1px solid #E5E6E0; }
    .login-mark { width: 46px; height: 46px; display: grid; place-items: center; flex: none; }
    .login-kicker { margin: 0 0 5px; color: #0F7A5C; font-size: 12px; font-weight: 700; }
    .login-brand h1 { margin: 0; font-size: 22px; line-height: 1.18; font-weight: 700; letter-spacing: 0; }
    .login-copy { margin: 8px 0 0; color: #686B63; font-size: 13px; line-height: 1.5; }
    .login-status { display: flex; align-items: center; gap: 8px; padding: 11px 24px; background: #F7F8F4; border-bottom: 1px solid #E5E6E0; color: #686B63; font-size: 12px; }
    .login-form { display: grid; gap: 15px; padding: 22px 24px 24px; }
    .login-alert { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; background: #FFF4D8; color: #8A5A00; font-size: 12.5px; font-weight: 600; }
    .login-field { display: grid; gap: 7px; color: #4E514A; font-size: 12px; font-weight: 600; }
    .login-input-wrap { display: flex; align-items: center; gap: 9px; min-height: 42px; padding: 0 12px; border: 1px solid #DBDDD5; border-radius: 8px; background: #F7F8F4; color: #74776F; }
    .login-input-wrap:focus-within { border-color: #378ADD; box-shadow: 0 0 0 3px rgba(55,138,221,.16); }
    .login-input-wrap input { width: 100%; border: 0; outline: 0; background: transparent; color: #20231F; font: inherit; font-size: 14px; }
    .login-submit { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 42px; border: 1px solid transparent; border-radius: 8px; background: #1D9E75; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
    @media (max-width: 480px) { .login-shell { padding: 14px; } .login-brand { padding: 20px 18px 16px; } .login-status { padding-left: 18px; padding-right: 18px; } .login-form { padding: 18px; } }
  </style>
</head>
<body>
{% from "_macros.html" import icon %}
  <main class="login-shell">
    <section class="login-panel" aria-labelledby="login-title">
      <div class="login-brand">
        <div class="login-mark" aria-hidden="true">
          <svg width="42" height="42" viewBox="0 0 34 34">
            <rect x="0" y="0" width="34" height="34" rx="9" fill="var(--teal)"/>
            <circle cx="17" cy="17" r="9.5" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="1.6"/>
            <circle cx="14.5" cy="15" r="3.1" fill="#0F3D2E"/>
            <circle cx="20.5" cy="20" r="1.8" fill="#0F3D2E" fill-opacity="0.8"/>
          </svg>
        </div>
        <div>
          <p class="login-kicker">Aqua Scope</p>
          <h1 id="login-title">Đăng nhập dashboard QC</h1>
          <p class="login-copy">Truy cập dữ liệu mẫu, cảnh báo và lịch sử audit của trạm quan trắc.</p>
        </div>
      </div>

      <div class="login-status">
        <span class="device-dot"></span>
        <span>LAN demo · append-only traceability</span>
      </div>

      <form class="login-form" method="post" action="/login">
        {% if error %}
        <div class="login-alert" role="alert">
          {{ icon('warn', 16) }}
          <span>Tên đăng nhập hoặc mật khẩu không đúng.</span>
        </div>
        {% endif %}

        <label class="login-field" for="username">
          <span>Tên đăng nhập</span>
          <span class="login-input-wrap">
            {{ icon('user', 16) }}
            <input id="username" name="username" required autofocus autocomplete="username" placeholder="admin">
          </span>
        </label>

        <label class="login-field" for="password">
          <span>Mật khẩu</span>
          <span class="login-input-wrap">
            {{ icon('lock', 16) }}
            <input id="password" type="password" name="password" required autocomplete="current-password" placeholder="Nhập mật khẩu">
          </span>
        </label>

        <button class="login-submit" type="submit">
          <span>Đăng nhập</span>
          {{ icon('arrow-right', 16) }}
        </button>
      </form>
    </section>
  </main>
</body>
</html>
